name: Test AI Karaoke on Real Apple Silicon Mac

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Validate Mac Scripts
        run: for f in Mac_Chip_M/*.command; do bash -n "$f"; done
      - name: Setup Environment
        run: python3 setup_env.py venv_mac
      - name: Verify AI on Apple Silicon
        run: |
          ./venv_mac/bin/python -c "
          import sys, torch
          print('Platform:', sys.platform)
          print('MPS GPU Available:', hasattr(torch.backends, 'mps') and torch.backends.mps.is_available())
          import demucs, faster_whisper, fastapi
          print('ALL CORE AI LIBRARIES LOADED PERFECTLY ON APPLE SILICON!')
          "
